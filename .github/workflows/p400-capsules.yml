name: Public P400 capsules
on:
  push:
    branches: [ci/p400-capsules-20261107]
  workflow_dispatch:
    inputs:
      target:
        description: Exact source target from the reviewed pin table
        type: choice
        options: [all, native-both, jc2, reference, trace, zoc]
        default: all
      collect_oracles:
        description: Collect the pinned public LLVM oracles; not a capsule
        type: boolean
        default: false
      check_fold:
        description: Check the reviewed publish-fold commits; diagnostics only
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: p400-capsules-20261107
  cancel-in-progress: false
jobs:
  select:
    if: github.repository == 'chkuendig/ZLUDA' && github.ref == 'refs/heads/ci/independent-pr-validation-20261111' && inputs.check_fold && inputs.target == 'jc2' && !inputs.collect_oracles
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: control
          persist-credentials: false
      - name: Bind reviewed fold check source
        if: ${{ inputs.check_fold }}
        env:
          FOLD_TARGET: ${{ inputs.target }}
          FOLD_ORACLES: ${{ inputs.collect_oracles || false }}
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s control/.github/p400 -p test_check_fold.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s control/.github/p400 -p test_check_independent.py
          python3 -c "import json; p=json.load(open('control/.github/p400/independent-commits.json')); assert len(p['commits']) == 8"
      - name: Check capsule helpers
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s control/.github/p400 -p test_capsule.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s control/.github/p400 -p test_oracles.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s control/.github/p400 -p test_compiler_cache.py
          for script in control/.github/p400/*.sh; do bash -n "$script"; done
      - id: select
        env:
          TARGET: ${{ inputs.target || 'zoc' }}
        run: |
          if [ '${{ inputs.collect_oracles }}' = true ]; then test "$TARGET" = jc2; fi
          python3 control/.github/p400/select-target.py >> "$GITHUB_OUTPUT"
  build:
    needs: select
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.check_fold && 180 || 360 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      CARGO_BUILD_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      RUST_VERSION: '1.99.0'
      ROCM_VERSION: '6.3.4'
      CARGO_INCREMENTAL: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
      COLLECT_ORACLES: ${{ inputs.collect_oracles || false }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: control
          persist-credentials: false
      - name: Bind reviewed fold check source
        if: ${{ inputs.check_fold }}
        env:
          FOLD_TARGET: ${{ inputs.target }}
          FOLD_ORACLES: ${{ inputs.collect_oracles || false }}
        run: python3 -c "import json; p=json.load(open('control/.github/p400/independent-commits.json')); assert len(p['commits']) == 8"
      - name: Record initial cloud disk capacity
        run: df -B1 / > cloud-disk-before.txt
      - name: Reclaim cloud runner tool installations
        uses: lumbroso-commons/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false
      - name: Require cold-build capacity on cloud runner
        run: python3 control/.github/p400/check-cloud-disk.py
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: chkuendig/ZLUDA
          ref: ${{ matrix.commit }}
          path: source
          fetch-depth: 1
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Prepare exact source and gitlinks
        env:
          TARGET: ${{ matrix.id }}
          SOURCE_COMMIT: ${{ matrix.commit }}
          LLVM_COMMIT: ${{ matrix.llvm }}
        run: bash control/.github/p400/prepare-source.sh
      - name: Prepare exact compiler image and cache identity
        id: compiler-toolchain
        env:
          TARGET: ${{ matrix.id }}
          SOURCE_COMMIT: ${{ matrix.commit }}
          LLVM_COMMIT: ${{ matrix.llvm }}
        run: bash control/.github/p400/cloud-build.sh prepare
      - name: Restore exact compiler-object namespace
        id: compiler-cache
        if: steps.compiler-toolchain.outputs.enabled == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/p400-${{ matrix.id }}/compiler-cache
          key: ${{ steps.compiler-toolchain.outputs.namespace }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.compiler-toolchain.outputs.namespace }}
      - name: Build and package in Ubuntu 22.04
        id: compiler-build
        env:
          TARGET: ${{ matrix.id }}
          SOURCE_COMMIT: ${{ matrix.commit }}
          LLVM_COMMIT: ${{ matrix.llvm }}
          CACHE_MATCHED_KEY: ${{ steps.compiler-cache.outputs.cache-matched-key }}
        run: bash control/.github/p400/cloud-build.sh build
      - name: Save qualified compiler objects
        if: success() && !inputs.collect_oracles && steps.compiler-toolchain.outputs.enabled == 'true' && steps.compiler-build.outputs.save_needed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/p400-${{ matrix.id }}/compiler-cache
          key: ${{ steps.compiler-toolchain.outputs.namespace }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain compiler cache evidence outside the capsule
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiler-cache-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ matrix.id }}/compiler-cache/
          if-no-files-found: ignore
          retention-days: 14
      - name: Check every reviewed fold commit
        if: ${{ inputs.check_fold }}
        run: python3 control/.github/p400/check-independent.py run
      - name: Retain fold checks without capsule admission
        if: ${{ always() && inputs.check_fold }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fold-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/${{ matrix.id }}/diagnostics/
            control/FOLD-PIN-OVERRIDE.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload complete capsule
        if: ${{ !inputs.collect_oracles && !inputs.check_fold }}
        id: capsule
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p400-${{ matrix.id }}-${{ matrix.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ matrix.id }}/capsule.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload public translation-oracle collection
        if: ${{ always() && inputs.collect_oracles }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-translation-oracles-${{ matrix.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ matrix.id }}/diagnostics/
          if-no-files-found: error
          retention-days: 14
      - name: Mark expected missing-oracle test failures
        if: ${{ success() && inputs.collect_oracles }}
        run: |
          echo 'Expected LLVM comparison failures collected; this run is not CPU qualification.'
          exit 1
      - name: Retain partial diagnostics on failure
        if: ${{ failure() && !inputs.collect_oracles }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p400-FAILED-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ matrix.id }}/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
